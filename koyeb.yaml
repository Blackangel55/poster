# koyeb.yaml — Koyeb service definition
# Deploy via: koyeb service create --config koyeb.yaml
# Or paste these settings in the Koyeb dashboard.

name: ott-poster-bot
type: worker          

# ─── Instance ────────────────────────────────────────────────────────────────
instance_type: free   
regions:
  - fra              

# ─── Ports ───────────────────────────────────────────────────────────────────
ports:
  - port: 8000
    protocol: http    

health_checks:
  - path: /health
    port: 8000
    initial_delay_seconds: 20
    period_seconds: 30

env:
  - name: API_ID
    value: ""          
  - name: API_HASH
    value: ""
  - name: BOT_TOKEN
    value: ""
  - name: SPIDY_KEY
    value: ""
  - name: SPIDY_BASE
    value: "https://api.spidyposter.com/v1/fetch"
  - name: SESSION_NAME
    value: "ott_poster_bot"
  - name: PLOT_MAX_CHARS
    value: "280"
  - name: API_TIMEOUT
    value: "15"
  - name: KEEP_ALIVE
    value: "true"
  - name: PORT
    value: "8000"
