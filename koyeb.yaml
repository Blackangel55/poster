# koyeb.yaml — Koyeb service definition
# Deploy via: koyeb service create --config koyeb.yaml
# Or paste these settings in the Koyeb dashboard.

name: ott-poster-bot

# ─── Build ───────────────────────────────────────────────────────────────────
# Koyeb builds from your GitHub repo using the Dockerfile.
# Connect your repo in the dashboard; this file is for reference.
type: worker          # worker = no public URL, just a background process
                      # BUT we still expose port 8000 for the health check

# ─── Instance ────────────────────────────────────────────────────────────────
instance_type: free   # nano on free tier; bump to small/medium for production
regions:
  - fra               # Frankfurt (closest to India with low latency)

# ─── Ports ───────────────────────────────────────────────────────────────────
ports:
  - port: 8000
    protocol: http    # Koyeb health check hits this

# ─── Health Check ────────────────────────────────────────────────────────────
health_checks:
  - path: /health
    port: 8000
    initial_delay_seconds: 20
    period_seconds: 30

# ─── Environment Variables ───────────────────────────────────────────────────
# Set these as secrets in the Koyeb dashboard → "Environment variables"
# DO NOT hardcode secrets here if committing to a public repo.
env:
  - name: API_ID
    value: ""          # ← fill in dashboard
  - name: API_HASH
    value: ""
  - name: BOT_TOKEN
    value: ""
  - name: SPIDY_KEY
    value: ""
  - name: SPIDY_BASE
    value: "https://api.spidyposter.com/v1/fetch"
  - name: SESSION_NAME
    value: "ott_poster_bot"
  - name: PLOT_MAX_CHARS
    value: "280"
  - name: API_TIMEOUT
    value: "15"
  - name: KEEP_ALIVE
    value: "true"
  - name: PORT
    value: "8000"
